<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070b10" />
    <meta
      name="description"
      content="TableTop — board games online, with persistent tables. Close the tab mid-turn and come back to the same seat."
    />
    <title>TableTop</title>

    <!--
      Self-hosted variable webfonts. Preloading the two latin files we always
      need removes the flash-of-unstyled-text: they are in flight before the
      stylesheet that references them is even parsed.
        · Oswald  — condensed industrial display face (headings, numerals)
        · Inter   — highly legible UI face (body, controls)
    -->
    <link
      rel="preload"
      href="/fonts/oswald-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Critical boot styles, inlined so the very first paint is already the game's
      dark base rather than a white browser canvas. Everything else lives in the
      SCSS design system.
    -->
    <style>
      html {
        background: #070b10;
        color-scheme: dark;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 30%, #101a24 0%, #070b10 65%);
        z-index: 9999;
        transition: opacity 420ms ease, visibility 420ms ease;
      }
      #boot[data-hidden='true'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot .boot-mark {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        border: 2px solid rgba(120, 210, 235, 0.18);
        border-top-color: #46e2ff;
        animation: boot-spin 900ms cubic-bezier(0.66, 0, 0.34, 1) infinite;
        box-shadow: 0 0 34px rgba(70, 226, 255, 0.28);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark {
          animation-duration: 2400ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Removed by main.tsx once React has committed its first frame. -->
    <div id="boot" role="status" aria-label="Loading TableTop">
      <div class="boot-mark"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
